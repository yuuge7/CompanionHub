name: Build & Release APK

# Every push to main auto-bumps the version in pubspec.yaml, builds a signed
# release APK, commits the bump back to main and publishes a GitHub Release
# named "Companion Hub vX.Y.Z" carrying that APK.
#
# The bump is the patch segment by default (1.5.0+2 -> 1.5.1+3); the build
# number (+N, Android versionCode) always increments so every release is
# installable over the previous one. Use the manual "Run workflow" button to
# pick a minor or major bump instead.
#
# No infinite loop: the bump is pushed with GITHUB_TOKEN, and pushes made with
# that token never trigger workflow runs. The [skip ci] marker in the commit
# message is a second layer of protection.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Which version segment to bump"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

# Two pushes in quick succession must not race for the same version bump.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    # Exposed to steps so `if:` can detect whether signing secrets are present.
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the release notes can diff against the last tag.
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.4"
          channel: stable
          cache: true

      - name: Bump version in pubspec
        id: version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          CURRENT=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          NAME="${CURRENT%%+*}"
          if [[ "$CURRENT" == *"+"* ]]; then BUILD="${CURRENT##*+}"; else BUILD=0; fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME"

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            *)     PATCH=$((PATCH + 1)) ;;
          esac
          BUILD=$((BUILD + 1))

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          sed -i -E "s/^version:.*/version: ${VERSION}+${BUILD}/" pubspec.yaml

          echo "Bumped ${CURRENT} -> ${VERSION}+${BUILD} (${BUMP})"
          {
            echo "version=${VERSION}"
            echo "build=${BUILD}"
            echo "tag=v${VERSION}"
            echo "name=Companion Hub v${VERSION}"
          } >> "$GITHUB_OUTPUT"

      # Recreate the release keystore + key.properties from repository secrets so
      # the APK is signed with the real key. If the secret is absent (e.g. a fork
      # without secrets) this is skipped and the build falls back to the debug key.
      - name: Set up release signing
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > companionhub-release.jks
          cat > android/key.properties <<EOF
          storePassword=${RELEASE_STORE_PASSWORD}
          keyPassword=${RELEASE_KEY_PASSWORD}
          keyAlias=${RELEASE_KEY_ALIAS}
          storeFile=companionhub-release.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build }}"

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             "CompanionHub-${{ steps.version.outputs.tag }}.apk"

      # Only reached once analyze/test/build all passed, so main never records a
      # version bump for a commit that could not produce an APK.
      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: release ${{ steps.version.outputs.tag }} [skip ci]"
          # Another push may have landed while the APK was building.
          git pull --rebase origin main
          git push origin HEAD:main

      # Make re-runs on the same version idempotent: drop any existing release
      # + tag so the new build cleanly replaces it at the current commit.
      - name: Remove previous release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" \
            --yes --cleanup-tag || true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.ref_name }}
          name: ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: CompanionHub-${{ steps.version.outputs.tag }}.apk
